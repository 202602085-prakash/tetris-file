<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111827;
    color: #fff;
    font-family: Arial, sans-serif;
  }
  .game {
    display: flex;
    gap: 22px;
    align-items: flex-start;
    padding: 20px;
  }
  canvas {
    background: #0b1020;
    border: 3px solid #374151;
    border-radius: 8px;
    display: block;
  }
  #board {
    width: 300px;
    height: 600px;
  }
  .panel {
    width: 190px;
    background: #1f2937;
    border-radius: 12px;
    padding: 18px;
  }
  h1 {
    margin: 0 0 15px;
    font-size: 28px;
    text-align: center;
  }
  .stat {
    background: #111827;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .stat span {
    display: block;
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 4px;
  }
  .stat strong { font-size: 22px; }
  #next {
    width: 120px;
    height: 100px;
    margin: 5px auto 15px;
  }
  button {
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 11px;
    margin-top: 8px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .controls {
    margin-top: 15px;
    font-size: 13px;
    line-height: 1.8;
    color: #d1d5db;
  }
  .mobile-controls {
    display: none;
    margin-top: 12px;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  .mobile-controls button { margin: 0; }
  .wide { grid-column: span 3; }

  @media (max-width: 600px) {
    .game { flex-direction: column; align-items: center; }
    .panel { width: 300px; }
    .mobile-controls { display: grid; }
  }
</style>
</head>
<body>

<div class="game">
  <canvas id="board" width="300" height="600"></canvas>

  <div class="panel">
    <h1>TETRIS</h1>

    <div class="stat">
      <span>Score</span>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <span>Lines</span>
      <strong id="lines">0</strong>
    </div>
    <div class="stat">
      <span>Level</span>
      <strong id="level">1</strong>
    </div>

    <div class="stat">
      <span>Next Piece</span>
      <canvas id="next" width="120" height="100"></canvas>
    </div>

    <button id="pauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>

    <div class="controls">
      <b>Keyboard</b><br>
      ← → Move<br>
      ↑ Rotate<br>
      ↓ Soft Drop<br>
      Space Hard Drop<br>
      P Pause
    </div>

    <div class="mobile-controls">
      <button onclick="move(-1)">←</button>
      <button onclick="rotate()">↻</button>
      <button onclick="move(1)">→</button>
      <button class="wide" onclick="softDrop()">↓ Soft Drop</button>
      <button class="wide" onclick="hardDrop()">⬇ Hard Drop</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const SIZE = 30;

const colors = [
  null,
  "#00e5ff", // I
  "#2563eb", // J
  "#f97316", // L
  "#facc15", // O
  "#22c55e", // S
  "#a855f7", // T
  "#ef4444"  // Z
];

const shapes = [
  [[1,1,1,1]],
  [[2,0,0],[2,2,2]],
  [[0,0,3],[3,3,3]],
  [[4,4],[4,4]],
  [[0,5,5],[5,5,0]],
  [[0,6,0],[6,6,6]],
  [[7,7,0],[0,7,7]]
];

let board;
let piece;
let nextPiece;
let score = 0;
let lines = 0;
let level = 1;
let dropCounter = 0;
let lastTime = 0;
let dropInterval = 800;
let paused = false;
let gameOver = false;

function createBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(0));
}

function randomPiece() {
  const shape = shapes[Math.floor(Math.random() * shapes.length)];
  return {
    matrix: shape.map(row => row.slice()),
    x: Math.floor(COLS / 2) - Math.ceil(shape[0].length / 2),
    y: 0
  };
}

function collide(p) {
  for (let y = 0; y < p.matrix.length; y++) {
    for (let x = 0; x < p.matrix[y].length; x++) {
      if (
        p.matrix[y][x] &&
        (board[y + p.y] === undefined ||
         board[y + p.y][x + p.x] === undefined ||
         board[y + p.y][x + p.x] !== 0)
      ) return true;
    }
  }
  return false;
}

function merge() {
  piece.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value) board[y + piece.y][x + piece.x] = value;
    });
  });
}

function clearLines() {
  let cleared = 0;

  outer:
  for (let y = ROWS - 1; y >= 0; y--) {
    for (let x = 0; x < COLS; x++) {
      if (board[y][x] === 0) continue outer;
    }
    board.splice(y, 1);
    board.unshift(Array(COLS).fill(0));
    cleared++;
    y++;
  }

  if (cleared) {
    const points = [0, 100, 300, 500, 800];
    score += points[cleared] * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 800 - (level - 1) * 70);
    updateStats();
  }
}

function spawnPiece() {
  piece = nextPiece || randomPiece();
  nextPiece = randomPiece();
  drawNext();

  if (collide(piece)) {
    gameOver = true;
    paused = false;
  }
}

function drop() {
  if (paused || gameOver) return;

  piece.y++;

  if (collide(piece)) {
    piece.y--;
    merge();
    clearLines();
    spawnPiece();
  }

  dropCounter = 0;
}

function softDrop() {
  if (paused || gameOver) return;
  piece.y++;
  if (collide(piece)) piece.y--;
  else {
    score++;
    updateStats();
  }
  dropCounter = 0;
}

function hardDrop() {
  if (paused || gameOver) return;

  let distance = 0;
  while (!collide(piece)) {
    piece.y++;
    distance++;
  }
  piece.y--;
  distance--;

  score += Math.max(0, distance) * 2;
  merge();
  clearLines();
  spawnPiece();
  updateStats();
  dropCounter = 0;
}

function move(dir) {
  if (paused || gameOver) return;
  piece.x += dir;
  if (collide(piece)) piece.x -= dir;
}

function rotateMatrix(matrix) {
  return matrix[0].map((_, i) =>
    matrix.map(row => row[i]).reverse()
  );
}

function rotate() {
  if (paused || gameOver) return;

  const oldMatrix = piece.matrix;
  const oldX = piece.x;
  piece.matrix = rotateMatrix(piece.matrix);

  let offset = 1;
  while (collide(piece)) {
    piece.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));

    if (Math.abs(offset) > piece.matrix[0].length) {
      piece.matrix = oldMatrix;
      piece.x = oldX;
      return;
    }
  }
}

function drawCell(context, x, y, value, size) {
  if (!value) return;

  context.fillStyle = colors[value];
  context.fillRect(x * size, y * size, size, size);

  context.strokeStyle = "rgba(255,255,255,.18)";
  context.strokeRect(x * size, y * size, size, size);

  context.fillStyle = "rgba(255,255,255,.18)";
  context.fillRect(x * size + 3, y * size + 3, size - 6, 4);
}

function drawMatrix(context, matrix, offsetX, offsetY, size) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      drawCell(context, x + offsetX, y + offsetY, value, size);
    });
  });
}

function draw() {
  ctx.fillStyle = "#0b1020";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = "rgba(255,255,255,.05)";
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * SIZE, 0);
    ctx.lineTo(x * SIZE, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * SIZE);
    ctx.lineTo(canvas.width, y * SIZE);
    ctx.stroke();
  }

  board.forEach((row, y) => {
    row.forEach((value, x) => drawCell(ctx, x, y, value, SIZE));
  });

  if (piece) drawMatrix(ctx, piece.matrix, piece.x, piece.y, SIZE);

  if (paused || gameOver) {
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "bold 32px Arial";
    ctx.fillText(gameOver ? "GAME OVER" : "PAUSED", canvas.width / 2, 270);

    ctx.font = "16px Arial";
    ctx.fillText(
      gameOver ? "Press R or Restart" : "Press P to continue",
      canvas.width / 2,
      310
    );
  }
}

function drawNext() {
  nextCtx.fillStyle = "#111827";
  nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

  if (!nextPiece) return;

  const size = 22;
  const w = nextPiece.matrix[0].length * size;
  const h = nextPiece.matrix.length * size;

  drawMatrix(
    nextCtx,
    nextPiece.matrix,
    (nextCanvas.width - w) / size / 2,
    (nextCanvas.height - h) / size / 2,
    size
  );
}

function updateStats() {
  document.getElementById("score").textContent = score;
  document.getElementById("lines").textContent = lines;
  document.getElementById("level").textContent = level;
}

function restart() {
  board = createBoard();
  score = 0;
  lines = 0;
  level = 1;
  dropInterval = 800;
  dropCounter = 0;
  paused = false;
  gameOver = false;
  nextPiece = randomPiece();
  spawnPiece();
  updateStats();
  draw();
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  document.getElementById("pauseBtn").textContent =
    paused ? "Resume" : "Pause";
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    move(-1);
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    move(1);
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    softDrop();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    rotate();
  } else if (e.code === "Space") {
    e.preventDefault();
    hardDrop();
  } else if (e.key.toLowerCase() === "p") {
    togglePause();
  } else if (e.key.toLowerCase() === "r") {
    restart();
  }
});

document.getElementById("pauseBtn").onclick = togglePause;
document.getElementById("restartBtn").onclick = restart;

function update(time = 0) {
  const delta = time - lastTime;
  lastTime = time;

  if (!paused && !gameOver) {
    dropCounter += delta;
    if (dropCounter > dropInterval) drop();
  }

  draw();
  requestAnimationFrame(update);
}

restart();
update();
</script>
</body>
</html>
